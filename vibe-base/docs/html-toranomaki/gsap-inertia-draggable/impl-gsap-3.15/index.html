<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Inertia & Draggable Demo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  
<div class="demo-panel" id="drag-container" style="margin: 100px auto; cursor: default;">
  <div style="width:100%; height:100%; position:absolute; top:0; left:0;" id="drag-bounds"></div>
  <div id="drag-box" style="width:120px; height:120px; background:linear-gradient(135deg, #118AB2, #06D6A0); border-radius:20px; display:flex; align-items:center; justify-content:center; color:white; font-weight:bold; cursor:grab;">投げてみて！</div>
</div>
  <script src="https://unpkg.com/gsap@3.15.0/dist/gsap.min.js"></script>
  <script src="https://unpkg.com/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/gsap@3.15.0/dist/ScrollSmoother.min.js"></script>
  <script src="https://unpkg.com/gsap@3.15.0/dist/SplitText.min.js"></script>
  <script src="https://unpkg.com/gsap@3.15.0/dist/MorphSVGPlugin.min.js"></script>
  <script src="https://unpkg.com/gsap@3.15.0/dist/DrawSVGPlugin.min.js"></script>
  <script src="https://unpkg.com/gsap@3.15.0/dist/ScrambleTextPlugin.min.js"></script>
  <script src="https://unpkg.com/gsap@3.15.0/dist/Draggable.min.js"></script>
  <script src="https://unpkg.com/gsap@3.15.0/dist/InertiaPlugin.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
