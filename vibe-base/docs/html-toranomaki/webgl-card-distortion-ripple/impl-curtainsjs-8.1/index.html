<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[BLINDTEST] Ripple Only — クリック波紋</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #08090d;
            --text-primary: #faf5f0;
            --text-secondary: #8e92a2;
            --accent: #5ab4d4;
            --font-outfit: 'Outfit', sans-serif;
            --font-playfair: 'Playfair Display', serif;
        }
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-outfit);
            min-height: 100vh;
            display: flex; flex-direction: column;
            justify-content: flex-start; align-items: center;
            overflow-x: hidden; overflow-y: auto;
            position: relative; padding-bottom: 80px;
        }
        .badge {
            position: fixed; top: 16px; right: 16px;
            background: rgba(90,180,212,0.12);
            border: 1px solid var(--accent);
            color: var(--accent);
            font-size: 11px; font-weight: 600;
            letter-spacing: 2px; text-transform: uppercase;
            padding: 6px 14px; border-radius: 4px;
            z-index: 100; pointer-events: none;
        }
        .glow {
            position: absolute; width: 800px; height: 800px;
            background: radial-gradient(circle, rgba(90,180,212,0.04) 0%, rgba(8,9,13,0) 70%);
            top: 400px; left: 50%; transform: translate(-50%, -50%);
            z-index: 0; pointer-events: none;
        }
        #canvas {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1; pointer-events: none;
        }
        header {
            margin-top: 60px; margin-bottom: 40px;
            text-align: center; z-index: 2; pointer-events: none;
        }
        header h1 { font-family: var(--font-playfair); font-size: 42px; font-weight: 400; margin: 0 0 10px 0; letter-spacing: 2px; }
        header p { color: var(--text-secondary); font-size: 14px; font-weight: 300; letter-spacing: 3px; text-transform: uppercase; margin: 0; }
        .cards-container {
            display: flex; flex-wrap: wrap; gap: 40px;
            justify-content: center; align-items: center;
            max-width: 1200px; z-index: 2; position: relative; padding: 0 20px;
        }
        .card-wrapper {
            position: relative; z-index: 2; border-radius: 24px;
            overflow: visible; cursor: pointer;
        }
        .card-vertical { width: 310px; height: 470px; }
        .card-horizontal { width: 460px; height: 310px; }
        .card-inner { position: relative; width: 100%; height: 100%; border-radius: 22px; overflow: visible; background: transparent; }
        .plane { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .plane img { display: none !important; opacity: 0 !important; width: 0 !important; height: 0 !important; position: absolute !important; pointer-events: none !important; }
        .card-content { position: absolute; bottom: 40px; left: 40px; right: 40px; z-index: 3; pointer-events: none; }
        .category { font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; display: inline-block; }
        .title { font-family: var(--font-playfair); font-size: 28px; font-weight: 400; margin: 0 0 12px 0; line-height: 1.2; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .description { font-size: 13px; font-weight: 300; color: var(--text-secondary); line-height: 1.6; margin: 0; opacity: 0.8; }
        footer { margin-top: 60px; z-index: 2; color: var(--text-secondary); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; pointer-events: none; }
    </style>
</head>
<body>
    <div class="badge">BLINDTEST: Ripple Only / コア技術 1の一部・2・3・5</div>
    <div class="glow"></div>
    <div id="canvas"></div>

    <header>
        <h1>Click Ripple Test</h1>
        <p>クリックで正円波紋 — ホバーうねりなし・ノイズマップなし</p>
    </header>

    <div class="cards-container">
        <!-- 縦カード: エッジ固定（edge-limit=0） -->
        <div class="card-wrapper card-vertical"
             data-ripple-vertex-intensity="0.020"
             data-ripple-fragment-intensity="0.12"
             data-ripple-edge-limit="0.0"
             data-ripple-edge-width="0.25"
             data-ripple-speed="0.022"
             data-ripple-max-time="180.0"
             data-ripple-frequency="9.0">
            <div class="card-inner">
                <div class="plane">
                    <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=640&auto=format&fit=crop" data-sampler="cardTexture" alt="Card 1" />
                </div>
                <div class="card-content">
                    <span class="category">Ripple Test</span>
                    <h2 class="title">Zero Spike</h2>
                    <p class="description">コア技術 2（正円）・3（後半減衰）・5（クランプ）確認</p>
                </div>
            </div>
        </div>

        <!-- 横カード: マイルドウォープ（edge-limit=0.1） -->
        <div class="card-wrapper card-horizontal"
             data-ripple-vertex-intensity="0.06"
             data-ripple-fragment-intensity="0.16"
             data-ripple-edge-limit="0.1"
             data-ripple-edge-width="0.2"
             data-ripple-speed="0.018"
             data-ripple-max-time="180.0"
             data-ripple-frequency="19.0">
            <div class="card-inner">
                <div class="plane">
                    <img src="https://images.unsplash.com/photo-1574169208507-84376144848b?q=80&w=640&auto=format&fit=crop" data-sampler="cardTexture" alt="Card 2" />
                </div>
                <div class="card-content">
                    <span class="category">Ripple Test</span>
                    <h2 class="title">Golden Ripple</h2>
                    <p class="description">ホバーしても何も起きないことを確認</p>
                </div>
            </div>
        </div>
    </div>

    <footer>BLINDTEST — webgl-card-distortion-ripple</footer>

    <!-- 頂点シェーダー: コア技術 1の一部（クリック点からの放射計算）・2（アスペクト比補正）・3（後半集中減衰）のみ -->
    <script id="vs" type="x-shader/x-vertex">
        #ifdef GL_ES
        precision mediump float;
        #endif

        attribute vec3 aVertexPosition;
        attribute vec2 aTextureCoord;

        uniform mat4 uMVMatrix;
        uniform mat4 uPMatrix;

        uniform vec2 uClickPosition;
        uniform float uClickTime;
        uniform float uRippleVertexIntensity;
        uniform float uRippleEdgeLimit;
        uniform float uRippleEdgeWidth;
        uniform float uRippleSpeed;
        uniform float uRippleMaxTime;
        uniform float uAspect;
        uniform float uRippleFrequency;

        varying vec2 vTextureCoord;

        void main() {
            vTextureCoord = aTextureCoord;
            vec3 position = aVertexPosition;

            if (uClickTime >= 0.0) {
                // コア技術 2: アスペクト比補正で正円距離を計算
                vec2 correctedUV = aTextureCoord;
                correctedUV.x *= uAspect;
                vec2 correctedClick = uClickPosition;
                correctedClick.x *= uAspect;

                float distClick = distance(correctedUV, correctedClick);
                float waveFront = uClickTime * uRippleSpeed;
                float distFromWave = abs(distClick - waveFront);

                // コア技術 3: 後半集中減衰 smoothstep(1.0, 0.7, lifeRatio)
                float lifeRatio = uClickTime / uRippleMaxTime;
                float timeDecay = smoothstep(1.0, 0.7, lifeRatio);
                float rippleStrength = smoothstep(0.18, 0.0, distFromWave) * timeDecay;

                float edgeMask = smoothstep(0.0, uRippleEdgeWidth, aTextureCoord.x) *
                                 smoothstep(1.0, 1.0 - uRippleEdgeWidth, aTextureCoord.x) *
                                 smoothstep(0.0, uRippleEdgeWidth, aTextureCoord.y) *
                                 smoothstep(1.0, 1.0 - uRippleEdgeWidth, aTextureCoord.y);
                edgeMask = uRippleEdgeLimit + (1.0 - uRippleEdgeLimit) * edgeMask;

                float rippleWave = sin((distClick - waveFront) * uRippleFrequency) * rippleStrength * uRippleVertexIntensity * edgeMask;

                // コア技術 1の一部: クリック点から放射状の方向ベクトル（アスペクト比補正空間で計算）
                vec2 dir = aTextureCoord - uClickPosition;
                vec2 correctedDir = dir;
                correctedDir.x *= uAspect;
                float len = length(correctedDir);
                if (len > 0.0) {
                    vec2 normDir = correctedDir / len;
                    position.x += (normDir.x * rippleWave) / uAspect;
                    position.y += normDir.y * rippleWave;
                }
            }

            gl_Position = uPMatrix * uMVMatrix * vec4(position, 1.0);
        }
    </script>

    <!-- フラグメントシェーダー: コア技術 2（アスペクト比）・3（減衰）・5（clamp境界保護）のみ。ノイズマップなし -->
    <script id="fs" type="x-shader/x-fragment">
        #ifdef GL_ES
        precision mediump float;
        #endif

        varying vec2 vTextureCoord;

        uniform sampler2D cardTexture;

        uniform vec2 uClickPosition;
        uniform float uClickTime;
        uniform float uRippleFragmentIntensity;
        uniform float uRippleSpeed;
        uniform float uRippleMaxTime;
        uniform float uAspect;
        uniform float uRippleFrequency;

        void main() {
            vec2 uv = vTextureCoord;
            vec2 distortedCoord = uv;

            if (uClickTime >= 0.0) {
                // コア技術 2: アスペクト比補正
                vec2 correctedUV = uv;
                correctedUV.x *= uAspect;
                vec2 correctedClick = uClickPosition;
                correctedClick.x *= uAspect;

                float distClick = distance(correctedUV, correctedClick);
                float waveFront = uClickTime * uRippleSpeed;
                float distFromWave = abs(distClick - waveFront);

                // コア技術 3: 後半集中減衰
                float lifeRatio = uClickTime / uRippleMaxTime;
                float timeDecay = smoothstep(1.0, 0.7, lifeRatio);
                float rippleStrength = smoothstep(0.18, 0.0, distFromWave) * timeDecay;

                float rippleDisplacement = sin((distClick - waveFront) * uRippleFrequency) * rippleStrength * uRippleFragmentIntensity;

                vec2 dir = uv - uClickPosition;
                vec2 correctedDir = dir;
                correctedDir.x *= uAspect;
                float len = length(correctedDir);
                if (len > 0.0) {
                    vec2 normDir = correctedDir / len;
                    distortedCoord.x += (normDir.x * rippleDisplacement) / uAspect;
                    distortedCoord.y += normDir.y * rippleDisplacement;
                }
            }

            // コア技術 5: テクスチャ境界保護 clamp
            vec4 imgColor = texture2D(cardTexture, clamp(distortedCoord, vec2(0.0), vec2(1.0)));

            float shadow = smoothstep(0.9, 0.1, uv.y) * 0.4 + 0.6;
            vec4 cardColor = vec4(imgColor.rgb * shadow, 1.0);

            // ゴールドボーダー（歪み前座標で描画）
            vec4 borderColor = vec4(0.83, 0.69, 0.22, 1.0);
            float borderMask = smoothstep(0.0, 0.015, uv.x) *
                               smoothstep(1.0, 0.985, uv.x) *
                               smoothstep(0.0, 0.015, uv.y) *
                               smoothstep(1.0, 0.985, uv.y);

            gl_FragColor = mix(borderColor, cardColor, borderMask);
        }
    </script>

    <script type="module">
        import { Curtains, Plane } from 'https://cdn.jsdelivr.net/npm/curtainsjs@8.1.3/src/index.mjs';

        window.addEventListener("DOMContentLoaded", () => {
            const curtains = new Curtains({
                container: "canvas",
                pixelRatio: Math.min(1.5, window.devicePixelRatio),
                production: true
            });

            curtains.onError(() => {
                document.body.style.background = "#08090d";
                console.warn("WebGL unsupported.");
            });

            document.querySelectorAll(".plane").forEach((planeElement) => {
                const wrapperElement = planeElement.closest(".card-wrapper");

                const rippleVertexIntensity    = parseFloat(wrapperElement.getAttribute("data-ripple-vertex-intensity")   || "0.05");
                const rippleFragmentIntensity  = parseFloat(wrapperElement.getAttribute("data-ripple-fragment-intensity") || "0.08");
                const rippleEdgeLimit          = parseFloat(wrapperElement.getAttribute("data-ripple-edge-limit")         || "0.0");
                const rippleEdgeWidth          = parseFloat(wrapperElement.getAttribute("data-ripple-edge-width")         || "0.15");
                const rippleFrequency          = parseFloat(wrapperElement.getAttribute("data-ripple-frequency")          || "15.0");
                const rippleSpeed              = parseFloat(wrapperElement.getAttribute("data-ripple-speed")              || "0.018");
                const rippleMaxTime            = parseFloat(wrapperElement.getAttribute("data-ripple-max-time")           || "180.0");

                const rect = wrapperElement.getBoundingClientRect();
                const aspect = rect.width / rect.height;

                let clickTime = -1.0;
                const clickPosition = { x: 0.5, y: 0.5 };

                const params = {
                    vertexShaderID: "vs",
                    fragmentShaderID: "fs",
                    widthSegments: 35,
                    heightSegments: 35,
                    uniforms: {
                        uClickPosition:         { name: "uClickPosition",         type: "2f", value: [0.5, 0.5] },
                        uClickTime:             { name: "uClickTime",             type: "1f", value: -1.0 },
                        uRippleVertexIntensity: { name: "uRippleVertexIntensity", type: "1f", value: rippleVertexIntensity },
                        uRippleEdgeLimit:       { name: "uRippleEdgeLimit",       type: "1f", value: rippleEdgeLimit },
                        uRippleEdgeWidth:       { name: "uRippleEdgeWidth",       type: "1f", value: rippleEdgeWidth },
                        uRippleFragmentIntensity:{ name: "uRippleFragmentIntensity", type: "1f", value: rippleFragmentIntensity },
                        uRippleSpeed:           { name: "uRippleSpeed",           type: "1f", value: rippleSpeed },
                        uRippleMaxTime:         { name: "uRippleMaxTime",         type: "1f", value: rippleMaxTime },
                        uAspect:                { name: "uAspect",                type: "1f", value: aspect },
                        uRippleFrequency:       { name: "uRippleFrequency",       type: "1f", value: rippleFrequency }
                    }
                };

                const plane = new Plane(curtains, planeElement, params);

                plane.onReady(() => {
                    wrapperElement.addEventListener("mousedown", (e) => {
                        const rect = wrapperElement.getBoundingClientRect();
                        clickPosition.x = (e.clientX - rect.left) / rect.width;
                        clickPosition.y = (e.clientY - rect.top) / rect.height;
                        plane.uniforms.uClickPosition.value = [clickPosition.x, clickPosition.y];
                        clickTime = 0.0;
                    });

                    wrapperElement.addEventListener("touchstart", (e) => {
                        const rect = wrapperElement.getBoundingClientRect();
                        const touch = e.touches[0];
                        clickPosition.x = (touch.clientX - rect.left) / rect.width;
                        clickPosition.y = (touch.clientY - rect.top) / rect.height;
                        plane.uniforms.uClickPosition.value = [clickPosition.x, clickPosition.y];
                        clickTime = 0.0;
                    }, { passive: true });

                }).onRender(() => {
                    if (clickTime >= 0.0) {
                        clickTime += 1.0;
                        if (clickTime > rippleMaxTime) clickTime = -1.0;
                    }
                    plane.uniforms.uClickTime.value = clickTime;
                });
            });
        });
    </script>
</body>
</html>
