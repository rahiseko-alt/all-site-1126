<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - shaders - ocean</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23001e0f'/><path d='M10 38c8-12 16-12 24 0s16 12 20 4' fill='none' stroke='%23b7f7ff' stroke-width='4' stroke-linecap='round'/></svg>">
		<style>
			body {
				margin: 0;
				background-color: #000;
				color: #fff;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
				overflow: hidden;
			}
			#info {
				position: absolute;
				top: 10px;
				width: 100%;
				text-align: center;
				z-index: 100;
				display: block;
				pointer-events: none;
				text-shadow: 0 1px 2px rgba(0,0,0,0.8);
			}
			a {
				color: #ff0;
				pointer-events: auto;
				text-decoration: none;
			}
			a:hover {
				text-decoration: underline;
			}
			#container {
				width: 100vw;
				height: 100vh;
			}
			
			/* lil-gui custom Glassmorphism styles */
			.lil-gui {
				--background-color: rgba(20, 20, 20, 0.4) !important;
				--text-color: #f3f4f6 !important;
				--title-background-color: rgba(255, 255, 255, 0.05) !important;
				--widget-color: rgba(255, 255, 255, 0.1) !important;
				--hover-color: rgba(255, 255, 255, 0.2) !important;
				--focus-color: rgba(255, 255, 255, 0.3) !important;
				--number-color: #38bdf8 !important;
				--string-color: #34d399 !important;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
				border-radius: 16px !important;
				border: 1px solid rgba(255, 255, 255, 0.2) !important;
				backdrop-filter: blur(25px) saturate(150%) !important;
				-webkit-backdrop-filter: blur(25px) saturate(150%) !important;
				box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5) !important;
				overflow: hidden !important;
				padding: 16px !important;
			}
			
			.lil-gui .title {
				display: none !important;
			}
			
			.lil-gui .controller {
				margin: 12px 0 !important;
				padding: 8px 4px !important;
				display: flex !important;
				align-items: center !important;
			}

			.lil-gui .controller .name {
				font-size: 14px !important;
				opacity: 0.9 !important;
				font-weight: 500 !important;
			}

			.lil-gui input[type="number"],
			.lil-gui select,
			.lil-gui .option {
				background: rgba(255, 255, 255, 0.08) !important;
				border: 1px solid rgba(255, 255, 255, 0.1) !important;
				border-radius: 8px !important;
				color: #fff !important;
				padding: 6px 8px !important;
				font-size: 14px !important;
				transition: all 0.2s ease !important;
			}

			.lil-gui input[type="number"]:focus {
				background: rgba(255, 255, 255, 0.15) !important;
				border-color: rgba(255, 255, 255, 0.3) !important;
			}

			.lil-gui .slider {
				background: rgba(255, 255, 255, 0.1) !important;
				border-radius: 8px !important;
				height: 16px !important;
			}

			.lil-gui .slider .fill {
				background: rgba(255, 255, 255, 0.4) !important;
				border-radius: 8px !important;
			}
			
			/* Embed Stats canvas with matching border radius and centering */
			.lil-gui canvas {
				border-radius: 8px !important;
				margin-top: 20px !important;
				margin-bottom: 8px !important;
				box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3) !important;
				display: block !important;
				margin-left: auto !important;
				margin-right: auto !important;
				transform: scale(1.1) !important;
				transform-origin: center !important;
			}
			
			/* Hide lil-gui default title to remove accordion behavior entirely */
			.lil-gui > .title {
				display: none !important;
			}

			/* Custom Slide-in Container */
			#gui-container {
				position: fixed;
				top: 20px;
				right: -350px;
				transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
				z-index: 100;
			}
			#gui-container.show {
				right: 20px;
			}
			
			/* Glass Button (3D Sphere) */
			.glass-button {
				position: fixed;
				bottom: 30px;
				right: 30px;
				width: 28px;
				height: 28px;
				border-radius: 50%;
				/* Create 3D spherical glass effect */
				background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.2) 25%, rgba(0, 0, 0, 0.2) 75%, rgba(0, 0, 0, 0.5) 100%);
				box-shadow: 
					inset -4px -4px 10px rgba(0, 0, 0, 0.6), 
					inset 3px 3px 10px rgba(255, 255, 255, 0.8), 
					0 10px 25px rgba(0, 0, 0, 0.5);
				backdrop-filter: blur(10px);
				-webkit-backdrop-filter: blur(10px);
				cursor: pointer;
				z-index: 101;
				transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
			}
			.glass-button:hover {
				transform: scale(1.2);
			}
		</style>
	</head>
	<body>

		<div id="container"></div>

		<script type="importmap">
			{
				"imports": {
					"three": "https://unpkg.com/three@0.169.0/build/three.module.js",
					"three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';

			import Stats from 'three/addons/libs/stats.module.js';

			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { Water } from 'three/addons/objects/Water.js';
			import { Sky } from 'three/addons/objects/Sky.js';
			import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
			import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
			import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
			import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

			let container, stats;
			let camera, scene, renderer, composer;
			let controls, water, sun, sky, mesh, bloomPass;

			init();

			function init() {

				container = document.getElementById( 'container' );

				//

				renderer = new THREE.WebGLRenderer( { outputBufferType: THREE.HalfFloatType } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMappingExposure = 0.18;
				container.appendChild( renderer.domElement );

				//

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x08111b );
				scene.fog = new THREE.FogExp2( 0x0b1620, 0.00115 );

				camera = new THREE.PerspectiveCamera( 55, window.innerWidth / window.innerHeight, 1, 20000 );
				camera.position.set( 30, 30, 100 );

				// EffectComposer postprocessing

				composer = new EffectComposer( renderer );
				const renderPass = new RenderPass( scene, camera );
				composer.addPass( renderPass );

				bloomPass = new UnrealBloomPass( new THREE.Vector2( window.innerWidth, window.innerHeight ), 1.5, 0.4, 0.85 );
				bloomPass.threshold = 0;
				bloomPass.strength = 0.15;
				bloomPass.radius = 0.5;
				composer.addPass( bloomPass );

				const outputPass = new OutputPass();
				composer.addPass( outputPass );

				//

				sun = new THREE.Vector3();

				// Water

				const waterGeometry = new THREE.PlaneGeometry( 10000, 10000 );

				water = new Water(
					waterGeometry,
					{
						textureWidth: 512,
						textureHeight: 512,
						waterNormals: new THREE.TextureLoader().load( 'textures/waternormals.jpg', function ( texture ) {

							texture.wrapS = texture.wrapT = THREE.RepeatWrapping;

						} ),
						sunDirection: new THREE.Vector3(),
						sunColor: 0xf9fbff,
						waterColor: 0x001522,
						distortionScale: 4.6,
						fog: true
					}
				);

				water.material.uniforms[ 'distortionScale' ].value = 4.6;
				water.material.uniforms[ 'size' ].value = 0.75;

				water.rotation.x = - Math.PI / 2;

				scene.add( water );

				// Skybox

				sky = new Sky();
				sky.scale.setScalar( 10000 );
				scene.add( sky );

				const skyUniforms = sky.material.uniforms;

				skyUniforms[ 'turbidity' ].value = 8.5;
				skyUniforms[ 'rayleigh' ].value = 3.1;
				skyUniforms[ 'mieCoefficient' ].value = 0.0045;
				skyUniforms[ 'mieDirectionalG' ].value = 0.82;
				if ( skyUniforms[ 'cloudCoverage' ] ) skyUniforms[ 'cloudCoverage' ].value = 0.4;
				if ( skyUniforms[ 'cloudDensity' ] ) skyUniforms[ 'cloudDensity' ].value = 0.5;
				if ( skyUniforms[ 'cloudElevation' ] ) skyUniforms[ 'cloudElevation' ].value = 0.5;

				const parameters = {
					elevation: 2,
					azimuth: 180,
					exposure: 0.18
				};

				const pmremGenerator = new THREE.PMREMGenerator( renderer );
				const sceneEnv = new THREE.Scene();

				let renderTarget;

				function updateSun() {

					const phi = THREE.MathUtils.degToRad( 90 - parameters.elevation );
					const theta = THREE.MathUtils.degToRad( parameters.azimuth );

					sun.setFromSphericalCoords( 1, phi, theta );

					sky.material.uniforms[ 'sunPosition' ].value.copy( sun );
					water.material.uniforms[ 'sunDirection' ].value.copy( sun ).normalize();

					if ( renderTarget !== undefined ) renderTarget.dispose();

					sceneEnv.add( sky );
					renderTarget = pmremGenerator.fromScene( sceneEnv );
					scene.add( sky );

					scene.environment = renderTarget.texture;

				}

				updateSun();

				//

				const geometry = new THREE.BoxGeometry( 30, 30, 30 );
				const material = new THREE.MeshStandardMaterial( {
					color: 0xdfe7ee,
					roughness: 0.18,
					metalness: 0.02
				} );

				mesh = new THREE.Mesh( geometry, material );
				scene.add( mesh );

				//

				controls = new OrbitControls( camera, renderer.domElement );
				controls.maxPolarAngle = Math.PI * 0.495;
				controls.target.set( 0, 10, 0 );
				controls.minDistance = 40.0;
				controls.maxDistance = 200.0;
				controls.update();

				//

				// Slide-in Container & Button
				const guiContainer = document.createElement('div');
				guiContainer.id = 'gui-container';
				document.body.appendChild(guiContainer);

				const glassButton = document.createElement('div');
				glassButton.className = 'glass-button';
				document.body.appendChild(glassButton);

				glassButton.addEventListener('click', () => {
					guiContainer.classList.toggle('show');
				});

				// GUI (No accordion, manual placement)
				const gui = new GUI( { autoPlace: false } );
				guiContainer.appendChild( gui.domElement );

				// Embed Stats panel inside GUI container for an integrated look
				stats = new Stats();
				stats.dom.style.position = 'relative';
				stats.dom.style.top = 'auto';
				stats.dom.style.left = 'auto';
				stats.dom.style.float = 'none';
				stats.dom.style.margin = '10px auto';
				gui.domElement.querySelector( '.children' ).appendChild( stats.dom );

				gui.add( parameters, 'elevation', 0, 90, 0.1 ).name( 'Sky Elevation' ).onChange( updateSun );
				gui.add( parameters, 'azimuth', - 180, 180, 0.1 ).name( 'Sky Azimuth' ).onChange( updateSun );
				gui.add( parameters, 'exposure', 0, 1, 0.0001 ).name( 'Exposure' ).onChange( function ( value ) {
					renderer.toneMappingExposure = value;
				} );

				const waterUniforms = water.material.uniforms;
				gui.add( waterUniforms.distortionScale, 'value', 0, 8, 0.1 ).name( 'Water Distortion' );
				gui.add( waterUniforms.size, 'value', 0.1, 10, 0.1 ).name( 'Water Size' );

				gui.add( bloomPass, 'strength', 0, 3, 0.01 ).name( 'Bloom Strength' );
				gui.add( bloomPass, 'radius', 0, 1, 0.01 ).name( 'Bloom Radius' );

				if ( skyUniforms.cloudCoverage ) gui.add( skyUniforms.cloudCoverage, 'value', 0, 1, 0.01 ).name( 'Cloud Coverage' );
				if ( skyUniforms.cloudDensity ) gui.add( skyUniforms.cloudDensity, 'value', 0, 1, 0.01 ).name( 'Cloud Density' );
				if ( skyUniforms.cloudElevation ) gui.add( skyUniforms.cloudElevation, 'value', 0, 1, 0.01 ).name( 'Cloud Elevation' );

				//

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );
				composer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				render();
				stats.update();

			}

			function render() {

				const time = performance.now() * 0.001;

				mesh.position.y = Math.sin( time ) * 20 + 5;
				mesh.rotation.x = time * 0.5;
				mesh.rotation.z = time * 0.51;

				water.material.uniforms[ 'time' ].value += 1.0 / 60.0;
				if ( sky.material.uniforms[ 'time' ] ) sky.material.uniforms[ 'time' ].value = time;

				composer.render();

			}

		</script>
	</body>
</html>
