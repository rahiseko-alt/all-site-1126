# プロローグ

## 私はエンジニアではありません

まずそこから書かないといけません。

プログラムを書いたことがない、というわけでも完全にはないのですが、
フロントエンドとバックエンドの違いをちゃんと説明できるようになったのは、
Claude Code を使い始めてから半年も経っていません。
データベースとは何か、API とはどういうものか、React と Vue のどちらが何に向いているか——
そういったことを「なんとなく分かる」程度になったのも、つい最近のことです。

そんな私が、複数の個人開発プロダクトを動かしています。
AI が書いたコードが本番で動いています。
これが現実です。すごいことだと思います。でも、楽な話でもありませんでした。

---

## 最初の1か月 ― Antigravity という遊び場

Claude Code を始める前に、私は別のツールを使っていました。
Google の Antigravity（当時のサービス名でそう呼んでいました）です。

あの1か月は、正直なところ「遊び」でした。
「AIにこう言えばこんなものが作れる」という感覚をつかむ時期。
ポンポンと指示を出して、それっぽい画面が表示されて、「すごいな」と満足する。
実際に動くものを作っていたかどうかは怪しいですが、少なくとも楽しかった。

ただ、その楽しさには天井がありました。

作ったものが積み重ならないのです。今日作ったものを明日続けようとすると、
AIは前回の文脈を覚えていない。同じ説明をもう一度する。もう一度作り直す。
「昨日の続き」ができない道具というのは、個人の趣味ならいいのですが、
本格的に何かを作ろうとした瞬間に壁になります。

そのころの私は、いくつかのアイデアを「なんとか形にしたい」という状態でした。
モバイルオーダーシステム、シフト管理アプリ、クチコミ分析AI……。
趣味の延長で始めたものが、だんだん「本当に使えるものにしたい」という欲求に変わっていった。
Antigravity ではその欲求に追いつけなかった。それが Claude Code に移った理由です。

---

## 分からないまま作りまくった日々

Claude Code に移ってからの最初の数か月は、
「分からないまま作る」という日々でした。

UI はどうあるべきか。フロントエンドのライブラリはどれを選ぶべきか。
バックエンドのサーバーはどこに置くのか。データベースはどう設計するのか。
API とはそもそも何か。

全部、後から知りました。いや、今でも完全には分かっていません。
でも、Claude Code に「こういうものを作りたい」と伝えると、Claude が全部書く。
私は動作確認をして、「ここが違う」「こっちの方がいい」と返す。
その往復で、何かが動くものができていく。

振り返ると信じがたいのですが、初期の数週間で
React + PocketBase のモバイルオーダーシステム、
Oracle Cloud に乗っかったサーバー構成、
Vercel にデプロイされた複数のウェブアプリ——
こういったものが次々と出来上がっていきました。

「エンジニアでなくてもアプリが作れる」という話は、本当でした。
ただし、ここで話を終わりにしてしまうと、重要なことを隠すことになります。

---

## 一番困ったこと ― 日を跨ぐと前に戻る

最初の壁は、想像していた種類のものではありませんでした。

コードが書けない、とか、技術が難しい、とかではなく——

**日を跨ぐと、開発が後戻りする。**

これが一番きつかった。

1日目に決めたことを、2日目の Claude は知らない。
前のセッションで「この方針でいく」と決めたことを、次のセッションで別の方向に進める。
「前回こうしましたよね」と伝えても、記録がなければ Claude には分からない。
そして私自身も、数日前に何をどうしたか、完全には覚えていない。

こういうことが積み重なると、開発が螺旋状に後退していきます。
直したつもりのバグが戻ってくる。決めたはずの設計がまた議論になる。
「前もやったはずなのに」という感覚が、だんだん慢性化してくる。

この状態は、Claude Code が悪いわけではありません。
AI は記憶を持たない。それはそういうものです。
問題は私の側にありました。**AI というマシンをちゃんと管理していなかった**のです。

---

## 気づいたこと ― バイブコーディングの本質

YouTube や SNS で「Claude Code で個人開発が楽になった」という話を目にします。
あれは嘘ではありません。確かに楽になります。

ただ、「楽になった」の意味が、見る人によって違います。

個人が遊び感覚でプロトタイプを作るなら、Claude Code は本当に楽です。
ざっと指示して、動くものが出てきて、また指示する。それで十分。

でも本気で何かを作ろうとしたとき——
複数のプロダクトを並行して動かしたいとき、
日をまたいで開発を継続したいとき、
複数の AI に役割分担させて効率を上げたいとき——

そこには「管理」が必要です。

AIというマシンは、適切に管理しないと暴走します。
コードの世界でもハルシネーション（事実と異なることを正しいかのように伝える現象）は起きます。
「修正済みです」と報告されたバグが、実は直っていなかった。
「確認しました」と言われた内容が、実際には確認されていなかった。
こういうことが、現実に起きます。

それと、トークン問題というのもあります。
Claude Code には1回の会話で処理できる情報量に上限があります（これをトークンと呼びます）。
長いセッションを続けていると、AIが過去の文脈を読み込めなくなる。
そうなると、ちぐはぐな回答が増えてくる。
この問題への対処も、管理の一部です。

私が「vibe-base」という仕組みを作ったのは、この「管理」をちゃんとやるためでした。

---

## この本で書くこと

この本は、私が Claude Code を使って個人開発を続けてきた2か月間の記録です。
成功談だけではありません。失敗も、撤退も、「なぜこうなったのか分からなかった」という混乱も書きます。

3つのことを伝えたいと思っています。

1つ目は、Claude Code はすごい道具だということ。
エンジニアでない私が複数のプロダクトを動かせているのは、事実です。

2つ目は、でも甘くない、ということ。
SNS で言われるほど簡単ではありません。個人の遊びレベルならいいのですが、
本気でやるなら AI というマシンを管理する必要があります。

3つ目は、だから私はこうした、ということ。
「vibe-base」という共通基盤と、「CLAUDE.md」という AI への憲法を作った。
その話を、なるべく具体的に書こうと思います。

技術的な解説書ではありません。
同じように「よく分からないまま始めた」人に、「こういう道もあった」と伝えるエッセイのつもりです。

それでは、始めます。

# 第1章 Claude Code との出会い

## この章で書くこと

私が Claude Code を本格的に使い始めた 2026年2月下旬の数日間の記録。
コードを書き始める前に何をしたか、そしてなぜそうしたかを残す。

---

## 2月24日 ― コードより先にインフラを建てた

Claude Code を初めて真面目に触った日、私はコードを1行も書かなかった。
代わりにやったのは、こういうことだった。

- `vibe-base/` というディレクトリを切る
- `CLAUDE.md`（AI共通憲法 v1.0）を書く
- `MISSION_LOG.md`（引き継ぎ台帳）を空で置く
- 各エージェント用の作業ディレクトリを分ける
- `git init` して Initial コミット

たったこれだけだ。機能はゼロ。動くものは何もない。
それでも、この日の Check-out ログには「Vibe-Base インフラの初期構築完了」と書いてある。

なぜ先にインフラを建てたのか。
答えは単純で、**AI エージェントが複数人で並行開発する**という前提から逆算したからだ。
Claude Code を「自分の代わりにコードを書いてくれる便利ツール」として使うなら、こんな準備はいらない。
必要になるのは、

- 複数のセッションにまたがっても記憶が飛ばないための「台帳」
- どこまで触っていいか決めた「憲法」
- 他のエージェントと衝突しないための「縄張り」

これを最初に決めておかないと、2日目か3日目に必ず破綻する。
AI に仕事を任せる側の人間として、**先にルールを書いておけば、AI がそのルールを守って自走する**。そう信じることにした。

結果的にこの判断は正しかった。2か月後の今、`MISSION_LOG.md` は 160 回以上の Check-out を記録していて、
私がセッションを跨いでも、新しい Claude は前回の続きから作業を再開できる。

## 2月24日午後 ― 最初の「実戦」は命名規則の強制リフォーム

その日のうちに、2本目のセッションが始まった。お題はこうだ。

> AG が持ち込んだ「モバイルオーダー＆管理システム」を kebab-case にリフォームせよ

当時、私はすでにいくつかの個人開発資産を別の場所で動かしていた。
Claude Code でそれを引き取るにあたって、Claude（Opus）が最初にやったのは **機能の追加でも、バグの修正でもなかった**。
やったのは、日本語フォルダ名の英語化と、計18ファイルの kebab-case リネームだった。

```
モバイルオーダー＆管理システム/  →  mobile-order-system/
```

一見、どうでもいい作業に見える。機能的には何も変わっていない。
しかし、CLAUDE.md v1.0 には「kebab-case 必須。日本語・スペース・大文字（拡張子除く）禁止」と書いてある。
これは後続のすべてのエージェントが「何をファイル名にしていいか」を迷わないために先に決めたルールだ。
持ち込みプロジェクトがこの憲法を破っているなら、受け入れる前に矯正する。

この日の Check-out に書かれたエラー回数は「1回」。
理由は「Windows ケース不感度問題」で、大文字小文字だけを変えるリネームが Windows では無視されるため、
一度別名にしてから本来の名前に戻す **2段階リネーム** で回避している。
こういう小さな罠は、マニュアルには書いていない。自分で踏んで、記録して、次に渡すしかない。

## 2月25日 ― 持ち込み案件の連鎖リフォーム

翌日は、持ち込みリフォームが連続した。

| プロダクト | 旧状態 | やったこと |
| --- | --- | --- |
| shift-board-app | 日本語ファイル名 | 全20ファイルを kebab-case にリネーム |
| x-auto-post-bot | 同上 | 同様にリフォーム |
| booking-app | 同上 | TSX のimportパスも修正 |
| review-analysis-bot | 同上 | 12ファイルリネーム + import 5箇所修正 |
| wikipedia-draft-bot | 同上 | 26ファイルリネーム + package.json 修正 |

この5本を、ほぼ1日で片付けている。
リフォームしかしていないのに、なぜこんなに手応えがあるのか。
たぶん「AI に単純作業を任せる」ことの意味を、私がこの日初めて実感したからだ。

これらのリフォーム作業は、人間がやれば丸一日かかる退屈な仕事だ。
ファイル名を直し、import パスを直し、ビルドが壊れていないか確認する。
Claude Code にそれを任せると、数分で片付く。しかも、「1プロダクト終わったら MISSION_LOG に書け」というルールを憲法に書いておいたおかげで、
5本分の作業ログが自動的に残った。

**ルールを書いておけば、作業のたびにルールの説明はいらない。**
この経験が、後に §5「AIセルフガバナンス」へと結実する。

## 2月25日午後 ― 最初の開発サイクルが回り始める

持ち込みリフォームが一段落した頃、本格的な開発も並走し始めた。
題材は mobile-order-system の Sprint 1。流れはこうだ。

1. **Claude（Opus）が設計**: `PLAN.md` を書いて、スコープを確定
2. **AG（別エージェント）が実装**: React + PocketBase で機能を組む
3. **Claude（Opus）がレビュー**: 3件のバグを発見・修正
   - `colSpan="6"` → `"7"`（7列テーブルの空行ズレ）
   - Time列とAction列の順番の逆転
   - `completeOrder` の try/catch 欠落
4. **AG が再デプロイ**: `npx vercel --prod`

この時点で、すでに **「設計担当AI」と「実装担当AI」と「レビュー担当AI」が分業している**。
1人の人間がすべての役割を持つ必要はない、というモデルが最初の数日で自然発生した。

そしてこの Sprint 1 の最後、Claude（Opus）は技術的負債を見逃さなかった。

> **技術的負債:** ngrok URL が `vite.config.js` と `package.json` にハードコード。

この一行は MISSION_LOG にそのまま記録され、1週間後の Sprint 3 で Cloudflare Tunnel 移行という形で回収される。
**見つけた負債を、その場で直さずログに書き残す**。この作法は、この時点で早くも身についている。

## なぜ最初の数日が重要なのか

本章のエピソードはどれも地味だ。
新機能もバグ修正も、派手な技術選定も出てこない。
それでも、この最初の3日間で決めたことが、その後の2か月間すべての運用ルールの原型になっている。

- **先にルールを書いてから動く**（§1 Refactor-on-Write の原型）
- **持ち込み資産は憲法に合わせて矯正する**（後の vest1 制度の原型）
- **MISSION_LOG にすべての判断を残す**（後のセッション復帰フローの原型）
- **AI同士の引き継ぎは台帳経由のみ**（後のハンドオフ・プロトコルの原型）

最初の数日間は、Claude Code の機能を試す期間ではなかった。
**Claude Code を使って何を作るかではなく、Claude Code をどう使うかを決める期間**だった。
この順番を守らなかったら、たぶん今の vibe-base は存在していない。

---

## 次章予告

次章では、この「AI共通憲法 v1.0」がどう書かれたのか、
何を書いて、何を書かなかったのか、そしてその後どう改訂されていったのかを扱う。

# 第2章 vibe-base の構想

## この章で書くこと

第1章では、Claude Code を使い始めた日に私がコードを1行も書かず、
代わりに `CLAUDE.md` と `MISSION_LOG.md` とフォルダ構造を作った、という **事実** を書いた。
第2章で書くのは、その背後にあった **思想** だ。

- なぜ vibe-base という名前の「共通基盤」を立てる必要があったのか
- AI共通憲法 v1.0 に何を書き、何を書かなかったのか
- 「1フォルダ=1エージェント」というモデルはどこから出てきたのか
- MISSION_LOG を単なる作業日報ではなく「台帳」として設計した理由

このあたりを扱う。

---

## 先に警戒していたこと

Claude Code を本格導入する時点で、私が警戒していたことは2つあった。

1つ目は、**セッションを跨いだ瞬間に記憶が消える**こと。
Claude Code は優秀だが、1セッション終わって次のセッションが立ち上がるとき、
そこにいる Claude は前回の Claude とは別人だ。前回の判断理由も、途中で捨てた選択肢も、
やり残した負債もすべて忘れている。この「記憶の断絶」を前提にしないと、
「前はこうしたはずなのに」という事故が日常的に起きる。

2つ目は、**複数のエージェントが同時に同じコードを触ったら衝突する**こと。
当時の私はすでに、設計・実装・レビューを違う AI に振り分け始めていた。
1つのリポジトリに複数の AI が並走する前提で動くなら、縄張りを切らないと
「どっちが最新か分からない」状態に一瞬で落ちる。

この2つは、どちらも Claude Code のせいではない。
**AI をチームで使おうとする瞬間に、どんな人間のチームでも発生する問題**だ。
ただ、人間のチームなら Slack と GitHub と口頭引き継ぎで何とかする。
AI のチームはそのどれも使えない。だから、**その穴を先に埋めておく基盤**がいる。
それを置く場所として、私は `vibe-base` というディレクトリを切った。

名前の由来はいたって適当だ。「vibe」は当時の私が気に入って使っていた曖昧な言葉で、
「base」は土台のつもり。かっこいい語源の話はない。
ただ、これが「プロダクトそのもの」ではなく「プロダクトを載せる基盤」だということだけは、
名前で明示しておきたかった。

---

## CLAUDE.md v1.0 に書いたこと（と、書かなかったこと）

初版の `CLAUDE.md` に書いた条文は、ごく少ない。
今の v5.1 は §0 から §6 まで章立てされ、メタルールやセルフガバナンスの規定がぎっしり詰まっているが、
v1.0 はもっとずっと薄かった。正直にいえば、骨格は3つしかなかった。

### ① 命名規則 ― kebab-case 必須

今の §4 にも生き残っている、たった1行のルール。

> 命名: kebab-case必須。日本語・スペース・大文字（拡張子除く）禁止

この1行は、書いた翌日から効いた。
第1章で書いた通り、当時の私は旧環境から6本のプロジェクトを引き取ろうとしていて、
そのすべてに日本語フォルダ名や全角スペースが混じっていた。
`モバイルオーダー＆管理システム/` とか、`Wikipedia　自動生成bot/` とか。
`CLAUDE.md` にこの1行があるだけで、Claude は受け入れ前に必ずリネームする。
私はそのたびに「やって」としか言っていない。
**ルールを書いておけば、ルールの説明をしなくていい**。これが憲法を置く最大の効用だった。

### ② 作業ディレクトリの分離 ― 各エージェントに縄張りを

当時のフォルダ構成はこうだった。

```
vibe-base/
├── CLAUDE.md
├── MISSION_LOG.md
├── agent-ag/          ← AG（別エージェント）の作業場
│   ├── mobile-order-system/
│   ├── shift-board-app/
│   ├── x-auto-post-bot/
│   ├── booking-app/
│   ├── review-analysis-bot/
│   └── wikipedia-draft-bot/
└── （Claude/Opus 自身の作業スペース）
```

`agent-ag/` というフォルダ名は、`agent-ag`（=AG というエージェント）の縄張りを
物理的に可視化したものだ。Claude（Opus）は設計とレビューだけを担当して、
`agent-ag/` 配下のファイルには書き込まない。AG は `agent-ag/` の中だけで実装する。
**同じリポジトリだけど、触っていい場所が違う**。

この「1フォルダ=1エージェント」というモデルは、v1.0 の条文には明記されていなかった。
条文として明記されたのはもっと後の版だ（現行の v5.1 §0 にようやく太字で書いてある）。
それでも Session 1 の Check-out ログに「各エージェント作業ディレクトリを整備した」と
はっきり書いてあるので、実装としては初日から存在していた。
条文化が遅れた理由は、たぶん「当たり前すぎて書くまでもなかった」からだと思う。
その「当たり前」が、後に全プロダクトの並列運用を支える軸になるとは、この時点では考えていなかった。

### ③ MISSION_LOG という「台帳」

v1.0 の『憲法』がやったことで、おそらく一番大きいのは
**MISSION_LOG.md を『作業日報』ではなく『台帳』として位置づけた**ことだ。

どう違うのか。日報は「その日やったこと」を書く。
台帳は「その仕事を次に引き継ぐ人に必要な情報」を書く。
似ているようで、役割が違う。

v1.0 の MISSION_LOG は、Check-out 単位でこういう情報を持っていた。

- **現状:** 今どこまで進んでいるか
- **次のステップ:** 次の人（次のセッションの Claude）が何をすべきか
- **エラー回数:** 同じ場所で何回失敗したか
- **技術的負債:** 見つけたけどこの Sprint では直さないもの

重要なのは、これらが全部 **「次の自分への手紙」** の形で書かれていることだ。
自分が明日忘れても、明日の Claude がこの1ファイルを読めば作業を再開できる。
そのために必要な情報だけを、毎回同じフォーマットで残す。

これが機能するのは、次に動く Claude が「読めと書いてある」からだ。
`CLAUDE.md` の側に「セッション開始時に MISSION_LOG を読め」と書いておけば、
Claude は勝手に Check-in してくれる。**台帳と憲法は、2つ合わせて1つのシステム**で、
どちらが欠けても引き継ぎは成立しない。

ちなみに、v1.0 の MISSION_LOG は「全部のセッションを1つのファイルに書く」設計だった。
これは2日後の v1.1 で早速「直近5件制」に改訂されている。
容量がすぐ逼迫することが分かったからだ。「アーカイブに流す」という運用は
このタイミングで生まれた。最初から正解を書けていたわけではない。

### v1.0 に「書かなかった」こと

一方で、v1.0 が敢えて書かなかった（もしくは、書く発想がまだなかった）こともある。
これは改訂履歴を逆算すると分かる。

- **横断チェック必須ルール** ― v1.3（2月28日）で追加。バグを1箇所直すとき、同じパターンが
  他のファイルにも潜んでいないか全文検索してから直す、という作法。v1.0 にはない
- **三打席ルール** ― 現行の形（「同一箇所3回失敗でコミット＆引き継ぎ」）は v1.8（3月5日）で精緻化。
  原始的な形は v1.0 〜 v1.7 のどこかで入った可能性があるが、確証はない
- **AIセルフガバナンス（§5）** ― v1.8 で新設。フェーズゲート、先行バリデーション、能力限界の事前申告など、
  「AI が自分で自分を縛る」ための条文群。v1.0 にはまったく存在しない
- **メタルール（Refactor-on-Write / Reference-over-Redundancy / Self-Correction Loop）** ― v3.0（3月9日）で新設。
  「ルール追加時は統合を先に検討せよ」「1箇所に定義し他は参照せよ」といった、憲法そのものの運用ルール

v1.0 は、いわば「AI が暴走した時の対策条項」を一切持っていなかった。
**命名と縄張りと台帳**。それだけ。
暴走対策は、実際に暴走が起きてから1条ずつ追加された。これは次章（第3章）で詳しく扱う。

## この憲法が2か月後の今、どう見えるか

現行の v5.1 は、改訂履歴を見れば分かる通り、
v1.0 → v1.1 → v1.8 → v2.2 → v3.0 → v4.0 → v4.9 → v5.1 と、
2か月で **25回以上** 改訂されている。450行あった時期もあれば、
v3.0 で120行に圧縮された時期もある。
条文の数だけ見れば、v1.0 から別物になったと言っていい。

それでも、骨格は v1.0 のままだ。

- §0 に書かれている「1フォルダ=1エージェント」は、Session 1 の `agent-ag/` そのもの
- §4 の kebab-case は、v1.0 から一字一句変わっていない
- MISSION_LOG を「台帳」として読ませる仕組みは、直近5件制やアーカイブへの分割を経ても、
  本質は v1.0 から動いていない

**追加されたのは規律であって、思想ではない**。
v1.x で増えた条文（横断チェック・三打席・AIセルフガバナンス）も、
v3.0 で新設されたメタルールも、v4.0 のプロダクトサイクル P0→P4 も、
すべて「v1.0 で決めた3つの骨格を守らせるための工夫」だと見ることができる。

思想を先に書き、そのあと守らせるための規律を積み足していく。
この順番を逆にしていたら、たぶん今の vibe-base は存在していない。
規律を先に積むと、そもそも何のための規律なのかが分からなくなって、
改訂のたびに整合が崩れる。骨格が先にあるから、あとからどんな条文を足しても
「これは骨格のどこに効くのか」を判定できる。

これが、vibe-base を `CLAUDE.md v1.0` からスタートさせた、最大の実感だ。

Aiueo LP を Misfits.PJ から vibe-base に移してきたとき、3視点シミュレーションで6件の問題が検出された。
`.gitignore` 欠落、`alert()` 残留、`form input` の `name` 属性欠落、`cycle-log.md` ヘッダー不整合。
こうした「外部で動いていたものを自分の家に入れたら、自分の家のルールで違反だらけだった」現象を防ぐために、
昇格手順という条文が生まれた。

数日後の v2.1 では「タスク完了の定義」が新設される。デプロイ＋本番URL動作確認を含む5ステップを必須化。
これは「AG が完了と言うけど、実は本番にデプロイされていない」事故への対策だ。
v2.2 ではタスク指示テンプレートに「目視確認チェックリスト」と「ギブアップルール」が追加された。
直帰率 91.7% という GA4 の生のメトリクスから、条文が1つ追加されている。
**数値が動かないと条文も動かない**、という改訂の癖が、この時点で完全に定着している。

## 3月9日 ― 466行を120行に圧縮する

v1.0 から v2.2 までで、CLAUDE.md は466行まで膨らんでいた。
v3.0 で、これを **120行に圧縮した**。

圧縮の方法はこうだ。

- 手順の詳細をすべて `docs/ops/` 配下の SOP ファイルに分離する（7ファイル）
- CLAUDE.md 本体には、SOP の索引と、命令型トリガーだけを置く
- 詳細を読みたい Claude は、トリガーを見て該当 SOP を読みに行く

そして v3.0 で **メタルール** が3つ新設された。これは「条文の書き方そのものを縛る条文」だ。

- **Refactor-on-Write:** ルール追加時、既存との統合・置換を先に検討。純増は最終手段
- **Reference-over-Redundancy:** 1箇所に定義、他からは参照パスを記せ
- **Self-Correction Loop:** SOPを読まずに作業開始禁止

メタルールが入ったことの意味は大きい。
それまでは「困ったら新しい条文を書く」というやり方だった。v3.0 以降は「新しい条文を書く前に、既存と統合できないか考える」が
強制される。同じ日に、466行を120行に削っているのも偶然ではない。**書く方向の改訂から、消す方向の改訂への転換点**が、
v3.0 だった。

ちなみに同じ3月9日には、別の事件も起きている。スキルインストーラー由来の不審ディレクトリが24個も検出され、
全削除された。`.codebuddy/`、`.continue/`、`.crush/`、`.factory/`、`.goose/`、`.junie/` ......
他の AI ツールの設定フォルダが、いつのまにか vibe-base 配下に大量に作られていた。
3レイヤーリファクタとこの環境汚染の発覚が同日というのは、おそらく偶然ではない。
「整理して剥がす」という意識が、その週に同時多発的に高まっていた。

## v1.0 から v3.0 までを並べてみると

ここまでの2週間で、CLAUDE.md は14回改訂されている。改訂の引き金は3パターンに分かれる。

- **運用事故:** 容量逼迫（v1.1）、UAT 空転（v1.3）、仲介作業発覚（v1.4）
- **観察された改善余地:** AG が逸脱する → マイクロタスク化（v1.5）、デプロイ忘れ → 完了の定義（v1.1）
- **構造改革:** 466行 → 120行リファクタ＋メタルール新設（v3.0）

そしてこの2週間で、v1.0 で書いた「命名・縄張り・台帳」の3つの骨格は **1文字も削られていない**。
追加されたのは全部「守らせる側の条文」だ。骨格が思想で、追加分が規律。この順番が逆だったら、
規律を増やすたびに思想が揺らいで、改訂のたびに整合が崩れていたはずだ。

私が CLAUDE.md を書いていてよかったと思うのは、まさにこの順番だ。
**先に思想を3行で書いておけば、あとから何百行追加しても、すべての条文が「3行のどこに効くのか」で評価できる**。
評価できれば消せる。消せれば、466行を120行にできる。

第4章では、この憲法と並行して育っていったもう1つの仕組み、PC表（プロジェクト・コントロール表）の発明について書く。
憲法が「やってはいけないこと」の集合だとすれば、PC表は「やるべきことの順番」の集合だ。
2つを組み合わせて、ようやく1人分のディレクター業務が AI 同士の引き継ぎで回るようになる。
