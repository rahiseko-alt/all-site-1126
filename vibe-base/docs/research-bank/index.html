// ============================================================
// RENDER
// ============================================================
const TAG_LABELS = {
  market: "市場", competitor: "競合", tech: "技術",
  ux: "UX", pricing: "価格", platform: "販路", legal: "法務",
  design: "デザイン", script: "スクリプト"
};

function renderStats() {
  const el = document.getElementById("stats");
  const total = BANK.entries.length;
  const totalSources = BANK.entries.reduce((s, e) => s + (e.sources || 0), 0);
  const products = [...new Set(BANK.entries.flatMap(e => e.products))].length;
  const tags = [...new Set(BANK.entries.flatMap(e => e.tags))].length;
  el.innerHTML = `
    <div class="stat"><span class="stat-value">${total}</span><span class="stat-label">リサーチ</span></div>
    <div class="stat"><span class="stat-value">${totalSources}</span><span class="stat-label">ソース</span></div>
    <div class="stat"><span class="stat-value">${products}</span><span class="stat-label">プロダクト</span></div>
    <div class="stat"><span class="stat-value">${tags}</span><span class="stat-label">カテゴリ</span></div>
  `;
}

function renderGrid(filter, query) {
  const grid = document.getElementById("grid");
  let entries = BANK.entries;
  if (filter && filter !== "all") entries = entries.filter(e => e.tags.includes(filter));
  if (query) {
    const q = query.toLowerCase();
    entries = entries.filter(e =>
      e.title.toLowerCase().includes(q) ||
      e.description.toLowerCase().includes(q) ||
      e.tags.some(t => TAG_LABELS[t]?.includes(q)) ||
      e.products.some(p => p.includes(q)) ||
      (e.reusableFor || []).some(r => r.toLowerCase().includes(q))
    );
  }
  if (!entries.length) { grid.innerHTML = '<div class="empty">該当するリサーチがありません</div>'; return; }

  grid.innerHTML = entries.map(e => `
    <a class="card" href="${e.file || e.originalPath}" title="${e.file ? 'データバンク内ファイル' : '元ファイル参照'}">
      <div class="card-header">
        <div class="card-title">${e.title}</div>
        <div class="card-date">${e.date}</div>
      </div>
      <div class="card-desc">${e.description}</div>
      <div class="card-meta">
        ${e.tags.map(t => `<span class="tag tag-${t}">${TAG_LABELS[t] || t}</span>`).join("")}
        ${e.products.map(p => `<span class="card-product">${p}</span>`).join("")}
        <span class="card-sources">${e.sources || "?"}sources</span>
      </div>
    </a>
  `).join("");
}

// Filters
let currentFilter = "all";
document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.filter;
    renderGrid(currentFilter, document.getElementById("search").value);
  });
});

// Search
document.getElementById("search").addEventListener("input", e => {
  renderGrid(currentFilter, e.target.value);
});

renderStats();
renderGrid("all", "");
