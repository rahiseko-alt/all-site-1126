<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>技術ポートフォリオ</title>
<style>
  :root{
    --ink:oklch(23% .014 255);
    --sub:oklch(48% .018 255);
    --muted:oklch(97.4% .006 90);
    --paper:oklch(99.3% .003 90);
    --line:oklch(86% .01 90);
    --line-strong:oklch(68% .016 255);
    --link:oklch(45% .11 238);
    --sel:oklch(94.5% .025 226);
    --ok:oklch(43% .09 155);
    --warn:oklch(48% .1 70);
    --code-bg:oklch(95.5% .01 250);
    --human-bg:oklch(96% .032 22);
    --human-ink:oklch(44% .13 25);
    --system-bg:oklch(95% .03 238);
    --system-ink:oklch(42% .12 242);
    --focus:oklch(55% .15 240);
  }
  *{box-sizing:border-box}
  html{background:var(--paper);overflow-x:clip;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;
    line-height:1.78;
    overflow-wrap:anywhere;
    overflow-x:clip;
  }
  .layout{
    width:min(1440px,100%);
    margin:0 auto;
    display:grid;
    grid-template-columns:minmax(272px,320px) minmax(0,1fr);
    min-height:100vh;
  }
  .nav{
    border-right:1px solid var(--line);
    padding:32px 22px 48px;
    position:sticky;
    top:0;
    align-self:start;
    max-height:100vh;
    overflow:auto;
  }
  .nav-disclosure summary{display:none;}
  .nav-content{min-width:0;}
  .nav h1{
    font-size:18px;
    line-height:1.35;
    margin:0 0 8px;
    padding:0 10px;
    letter-spacing:0;
  }
  .nav .lead{
    margin:0 0 24px;
    padding:0 10px;
    color:var(--sub);
    font-size:12.5px;
    line-height:1.65;
  }
  .nav .group-label{
    margin:28px 10px 8px;
    font-size:10px;
    color:var(--sub);
    letter-spacing:.08em;
    text-transform:uppercase;
    font-weight:700;
  }
  .nav ul{list-style:none;margin:0;padding:0;}
  .nav li{margin:0;}
  .nav a{
    display:block;
    padding:9px 10px;
    font-size:13px;
    color:var(--ink);
    text-decoration:none;
    border-radius:0;
    border-left:2px solid transparent;
    cursor:pointer;
    line-height:1.45;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .nav a:hover{background:var(--code-bg);}
  .nav a:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .nav a:active{background:var(--line);}
  .nav a.active{background:var(--sel);border-left-color:var(--link);color:var(--link);font-weight:700;}
  .detail{
    min-width:0;
    width:min(100%,1040px);
    padding:48px clamp(28px,5vw,72px) 88px;
  }
  .eyebrow{
    margin:0 0 10px;
    color:var(--sub);
    font-family:Consolas,"SFMono-Regular",monospace;
    font-size:11px;
    letter-spacing:.12em;
    font-weight:800;
    text-transform:uppercase;
  }
  h2{
    max-width:26ch;
    font-size:clamp(26px,3.3vw,40px);
    line-height:1.25;
    margin:0 0 30px;
    letter-spacing:0;
    text-wrap:balance;
    overflow-wrap:anywhere;
  }
  h3{
    font-size:18px;
    line-height:1.45;
    margin:0 0 10px;
    letter-spacing:0;
  }
  .summary{
    font-size:15.5px;
    color:#303238;
    margin:0 0 26px;
    max-width:68ch;
  }
  .block{
    margin:0 0 26px;
    padding:0 0 26px;
    border-bottom:1px solid var(--line);
  }
  .block:last-child{border-bottom:none;}
  .k{
    font-size:12px;
    color:var(--sub);
    text-transform:uppercase;
    letter-spacing:.06em;
    font-weight:800;
    margin:0 0 8px;
  }
  .v{font-size:14.5px;color:#303238;margin:0;}
  code{
    background:var(--code-bg);
    padding:2px 6px;
    border-radius:5px;
    font-family:Consolas,monospace;
    font-size:12.5px;
    color:var(--link);
  }
  .note{
    color:var(--sub);
    font-size:13px;
    margin:10px 0 0;
  }
  .demo-link{color:var(--ok);text-decoration:none;font-weight:700;}
  .demo-link:hover{text-decoration:underline;}
  .demo-note{font-size:12.5px;color:var(--sub);margin-top:6px;}
  .proof-list{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:10px;
    margin:22px 0 0;
  }
  .proof{
    border:1px solid var(--line);
    border-radius:8px;
    padding:13px 14px;
    background:var(--muted);
  }
  .proof b{display:block;font-size:13.5px;margin-bottom:4px;}
  .proof span{display:block;font-size:12.5px;color:var(--sub);line-height:1.55;}
  .flow{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:10px;
    margin:16px 0 0;
  }
  .flow-step{
    position:relative;
    min-width:0;
    border:1px solid var(--line);
    background:#fff;
    border-radius:8px;
    padding:11px 12px;
  }
  .flow-step:not(:last-child)::after{
    content:"";
    position:absolute;
    right:-8px;
    top:50%;
    width:10px;
    height:10px;
    border-top:2px solid var(--line);
    border-right:2px solid var(--line);
    transform:translateY(-50%) rotate(45deg);
    background:var(--paper);
  }
  .flow-step:nth-child(3n)::after{display:none;}
  .flow-step b{display:block;font-size:13.5px;line-height:1.45;}
  .flow-step span{display:block;margin-top:4px;font-size:12px;color:var(--sub);line-height:1.55;}
  .cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:14px;
    margin-top:18px;
  }
  .card{
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    padding:16px;
  }
  .card .tag{
    display:inline-block;
    color:var(--warn);
    background:#fff8e8;
    border:1px solid #f0dfbd;
    border-radius:999px;
    padding:2px 8px;
    font-size:11px;
    font-weight:700;
    margin-bottom:8px;
  }
  .card p{margin:0;color:#333;font-size:13.5px;line-height:1.65;}
  .process{
    counter-reset:step;
    display:grid;
    gap:12px;
    margin-top:18px;
  }
  .process-item{
    display:grid;
    grid-template-columns:44px minmax(0,1fr);
    gap:12px;
    align-items:start;
    padding:14px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
  }
  .process-item::before{
    counter-increment:step;
    content:counter(step);
    display:grid;
    place-items:center;
    width:36px;
    height:36px;
    border-radius:50%;
    background:var(--sel);
    color:var(--link);
    font-weight:800;
  }
  .process-item b{display:block;font-size:14.5px;margin-bottom:2px;}
  .process-item span{display:block;font-size:13px;color:var(--sub);line-height:1.65;}
  .callout{
    border-top:1px solid var(--line-strong);
    background:transparent;
    padding:16px 0 0;
    margin:28px 0 0;
    border-radius:0;
    color:var(--sub);
    font-size:12.5px;
  }
  .case-layout{
    display:grid;
    grid-template-columns:minmax(0,.86fr) minmax(420px,1fr);
    gap:26px;
    align-items:start;
  }
  .case-layout.video-only{
    display:block;
  }
  .case-main,
  .case-side{min-width:0;}
  .case-side{
    position:sticky;
    top:28px;
    display:grid;
    gap:34px;
  }
  .case-layout.video-only .case-side{
    position:static;
  }
  .side-panel{
    border:0;
    border-top:3px solid var(--ink);
    border-bottom:1px solid var(--line);
    border-radius:0;
    background:transparent;
    padding:22px 0 24px;
  }
  .side-panel h3{
    margin:0 0 12px;
    font-size:14px;
    font-family:Consolas,"SFMono-Regular",monospace;
    letter-spacing:.05em;
  }
  .side-panel p{
    margin:0;
    color:var(--ink);
    font-size:14.5px;
    line-height:1.85;
    max-width:78ch;
  }
  .metric-row{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:0;
    margin-top:24px;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }
  .metric{
    min-width:0;
    border:0;
    border-right:1px solid var(--line);
    border-radius:0;
    background:transparent;
    padding:14px 14px 13px;
  }
  .metric:last-child{border-right:0;}
  .metric b{
    display:block;
    font-family:Consolas,"SFMono-Regular",monospace;
    font-size:18px;
    line-height:1.25;
    color:var(--ink);
  }
  .metric span{display:block;margin-top:5px;color:var(--sub);font-size:10.5px;line-height:1.5;}
  .side-panel .note{
    margin-top:16px;
    color:var(--sub);
    font-size:12px;
    line-height:1.7;
  }
  .vd-panel{
    border-radius:0;
    background:transparent;
    padding:0;
  }
  .vd-panel h3{
    margin:0 0 12px;
    padding-bottom:10px;
    border-bottom:1px solid var(--line-strong);
    font-family:Consolas,"SFMono-Regular",monospace;
    font-size:13px;
    letter-spacing:.05em;
  }
  .vd-flow{
    display:grid;
    gap:4px;
    margin:0;
    padding:0;
    list-style:none;
    counter-reset:flow-step;
  }
  .vd-step{
    display:grid;
    grid-template-columns:minmax(210px,.72fr) minmax(0,1.45fr);
    gap:0;
    min-width:0;
    counter-increment:flow-step;
  }
  .vd-left,
  .vd-right{
    min-width:0;
    border:0;
    border-radius:0;
    padding:15px 17px;
  }
  .vd-step.human .vd-left,
  .vd-step.human .vd-right{
    background:var(--human-bg);
  }
  .vd-step.ai .vd-left,
  .vd-step.ai .vd-right{
    background:var(--system-bg);
  }
  .vd-left{border-right:1px solid color-mix(in oklch,var(--ink) 11%,transparent);}
  .vd-left b,
  .vd-right b{display:block;font-size:12.5px;line-height:1.45;}
  .vd-left b::before{
    content:counter(flow-step,decimal-leading-zero) "  ";
    font-family:Consolas,"SFMono-Regular",monospace;
    font-size:10px;
    color:var(--sub);
  }
  .vd-step.human .vd-left b{color:var(--human-ink);}
  .vd-step.ai .vd-left b{color:var(--system-ink);}
  .vd-left span{
    display:block;
    margin-top:6px;
    color:var(--sub);
    font-size:11.5px;
    line-height:1.55;
  }
  .vd-right p{
    margin:7px 0 0;
    color:var(--ink);
    font-size:12px;
    line-height:1.7;
  }
  .vd-right code{
    background:transparent;
    padding:0;
    border-radius:0;
    color:inherit;
  }
  @media(max-width:48rem){
    .layout{grid-template-columns:1fr;}
    .nav{
      position:sticky;
      top:0;
      z-index:10;
      max-height:100vh;
      border-right:none;
      border-bottom:1px solid var(--line);
      padding:0;
      background:color-mix(in oklch,var(--paper) 94%,transparent);
      backdrop-filter:blur(12px);
    }
    .nav-disclosure summary{
      display:flex;
      align-items:center;
      justify-content:space-between;
      min-height:48px;
      padding:0 18px;
      color:var(--ink);
      font-size:12px;
      font-weight:700;
      cursor:pointer;
      list-style:none;
    }
    .nav-disclosure summary::-webkit-details-marker{display:none;}
    .nav-disclosure summary::after{content:"＋";font-size:16px;font-weight:400;}
    .nav-disclosure[open] summary::after{content:"−";}
    .nav-disclosure summary:focus-visible{outline:2px solid var(--focus);outline-offset:-3px;}
    .nav-disclosure summary:active{background:var(--code-bg);}
    .nav-content{
      max-height:calc(100vh - 49px);
      overflow:auto;
      padding:18px 14px 28px;
      border-top:1px solid var(--line);
      background:var(--paper);
    }
    .nav h1{font-size:16px;}
    .nav .lead{margin-bottom:18px;}
    .nav .group-label{margin-top:20px;}
    .detail{padding:32px 18px 56px;}
    h2{font-size:clamp(25px,8vw,34px);word-break:normal;}
    .flow{display:grid;grid-template-columns:1fr;}
    .flow-step:nth-child(3n)::after{display:block;}
    .flow-step:not(:last-child)::after{
      right:50%;
      top:auto;
      bottom:-8px;
      transform:translateX(50%) rotate(135deg);
    }
    .process-item{grid-template-columns:38px minmax(0,1fr);}
    .case-layout{grid-template-columns:1fr;}
    .case-side{position:static;}
    .vd-step{grid-template-columns:1fr;}
    .vd-left{border-right:0;border-bottom:1px solid color-mix(in oklch,var(--ink) 11%,transparent);}
    .metric-row{grid-template-columns:repeat(2,minmax(0,1fr));}
    .metric:nth-child(2){border-right:0;}
    .metric:nth-child(-n+2){border-bottom:1px solid var(--line);}
    .metric b{font-size:16px;}
  }
  @media(min-width:78rem){
    .layout{width:min(1480px,100%);}
  }
</style>
</head>
<body>
<div class="layout">
  <nav class="nav" aria-label="技術ポートフォリオ">
    <details class="nav-disclosure" open>
      <summary>目次</summary>
      <div class="nav-content">
        <h1>技術ポートフォリオ</h1>
        <div class="group-label">進め方</div>
        <ul id="section-menu"></ul>
        <div class="group-label">実績</div>
        <ul id="item-menu"></ul>
      </div>
    </details>
  </nav>
  <main class="detail" id="detail"></main>
</div>

function detailedCaseHTML(it,i){
  const note=it.note ? `<p class="note">${esc(it.note)}</p>` : "";
  const steps=(it.steps || []).map(step=>`
    <li class="vd-step ${step.actor==="human" ? "human" : "ai"}">
      <div class="vd-left"><b>${esc(step.title)}</b><span>${esc(step.summary)}</span></div>
      <div class="vd-right"><b>${esc(step.tech)}</b><p>${esc(step.body)}</p></div>
    </li>
  `).join("");
  return `
    <p class="eyebrow">Case ${String(i+1).padStart(2,"0")}</p>
    <h2>${esc(it.title)}</h2>
    <div class="case-layout video-only">
      <aside class="case-side" aria-label="${esc(it.title)}の詳細">
        <section class="side-panel">
          <h3>概要</h3>
          <p>${esc(it.problem)}</p>
          ${note}
        </section>
        <section class="vd-panel">
          <h3>工程と技術構成</h3>
          <ol class="vd-flow">${steps}</ol>
        </section>
      </aside>
    </div>`;
}

const navLinks=[];

function setActive(key){
  navLinks.forEach(entry=>entry.link.classList.toggle("active",entry.key===key));
}

function settleNavigation(){
  if(typeof window!=="undefined" && typeof window.scrollTo==="function"){
    window.scrollTo(0,0);
  }
  if(typeof window!=="undefined" && window.matchMedia && window.matchMedia("(max-width: 48rem)").matches){
    const disclosure=document.querySelector(".nav-disclosure");
    if(disclosure) disclosure.removeAttribute("open");
  }
}

  detail.innerHTML=`

    <h2>${esc(section.title)}</h2>
    <p class="summary">${esc(section.summary)}</p>
    ${section.html}`;

// クリック遷移では URL にハッシュを残さない（営業資料として共有時に #item-N が付くのを防ぐ）。
// href は残すので、外部から届いた #item-N / #section-N の直リンクは従来どおり開く。
function keepUrlClean(e){
  if(e && typeof e.preventDefault==="function") e.preventDefault();
  if(typeof history!=="undefined" && history.replaceState){
    history.replaceState(null,"",location.pathname+location.search);
  }
}

sections.forEach((section,i)=>{
  const li=document.createElement("li");
  const a=document.createElement("a");
  const key=`section-${i}`;
  a.textContent=section.navTitle;
  a.href=`#${key}`;
  a.onclick=(e)=>{ keepUrlClean(e); renderSection(i); settleNavigation(); };
  li.appendChild(a);
  sectionMenu.appendChild(li);
  navLinks.push({key,link:a});
});

items.forEach((it,i)=>{
  const li=document.createElement("li");
  const a=document.createElement("a");
  const key=`item-${i}`;
  a.textContent=it.navTitle || it.title;
  a.href=`#${key}`;
  a.onclick=(e)=>{ keepUrlClean(e); renderItem(i); settleNavigation(); };
  li.appendChild(a);
  itemMenu.appendChild(li);
  navLinks.push({key,link:a});
});

function renderByKey(key){
  const sectionMatch=key.match(/^section-(\d+)$/);
  if(sectionMatch && sections[Number(sectionMatch[1])]){
    renderSection(Number(sectionMatch[1]));
    return;
  }
  const itemMatch=key.match(/^item-(\d+)$/);
  if(itemMatch && items[Number(itemMatch[1])]){
    renderItem(Number(itemMatch[1]));
    return;
  }
  renderSection(0);
}

if(typeof window!=="undefined"){
  window.addEventListener("hashchange",()=>renderByKey(location.hash.slice(1)));
}
renderByKey(location.hash.slice(1));
if(typeof window!=="undefined" && window.matchMedia && window.matchMedia("(max-width: 48rem)").matches){
  const disclosure=document.querySelector(".nav-disclosure");
  if(disclosure) disclosure.removeAttribute("open");
}
</script>
</body>
</html>
