<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flubber Morphing Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<section class="section" id="section-flubber">
  <div class="container">
    <div class="text-panel">
      <h2 class="plugin-title">Flubber</h2>
      <p>「全く異なる形状・頂点数」の図形同士の変形において、人間の直感に最も近い完璧な補間を行う究極のオープンソース・アルゴリズムです。ねじれや不自然な反転が一切起こりません。（ここではGSAPと組み合わせて駆動しています）</p>
    </div>
    <div class="demo-panel">
      <div class="morph-svg-container">
        <svg viewBox="0 0 100 100" width="100%" height="100%">
          <path id="flubber-shape" class="morph-path" d=""/>
        </svg>
      </div>
      <button class="replay-btn" onclick="playFlubber()">もう一度再生</button>
    </div>
  </div>
</section>

<script src="https://unpkg.com/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="https://unpkg.com/flubber@0.4.2/build/flubber.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
