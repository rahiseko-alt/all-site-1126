<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip QR Popout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="stage">
        <p class="eyebrow">[ CLICK A QR ]</p>
        <h1 class="title">Flip QR<br>Popout</h1>
        <p class="lead">枠は元の位置に残り、中の QR だけが中央へ飛び出す。GSAP Flip の data-flip-id 共有エレメントで、サムネ↔フルを1つの要素のように補間する。拡大側は pointer-events:none でジッターを防ぐ。</p>

        <!-- ドック: 枠(サムネ)はここに残る -->
        <div class="qr-dock">
            <button type="button" class="qr-dock-btn" data-qr="a" aria-label="QR A を拡大">
                <span class="qr-thumb"><img class="qr-mini" data-flip-id="qr-a" src="qr.svg" alt="QR A"></span>
                <span class="qr-dock-label">SITE</span>
            </button>
            <button type="button" class="qr-dock-btn" data-qr="b" aria-label="QR B を拡大">
                <span class="qr-thumb"><img class="qr-mini" data-flip-id="qr-b" src="qr.svg" alt="QR B"></span>
                <span class="qr-dock-label">CONTACT</span>
            </button>
        </div>
        <p class="hint">QR をクリック → 中央へ飛び出す。もう一度 / 背景 / Esc で戻る</p>
    </main>

    <!-- 拡大ステージ（pointer-events:none）＋ backdrop -->
    <div class="qr-stage" aria-hidden="true">
        <img class="qr-full" data-flip-id="qr-a" data-qr="a" src="qr.svg" alt="QR A 拡大">
        <img class="qr-full" data-flip-id="qr-b" data-qr="b" src="qr.svg" alt="QR B 拡大">
    </div>
    <div class="qr-backdrop" aria-hidden="true"></div>

    <!-- GSAP + Flip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Flip.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
