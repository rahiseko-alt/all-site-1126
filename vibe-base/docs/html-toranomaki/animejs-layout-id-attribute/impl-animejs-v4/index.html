<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime.js Layout ID Attribute</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="docs-demo-html" id="layout-layout-id-attribute">
    <div class="large layout centered row">
      <div class="layout-container container-a col grid-layout row">
        <div class="item" data-layout-id="item-A">A</div>
      </div>
      <div class="layout-container container-b col grid-layout row">
        <div class="item" data-layout-id="item-B">B</div>
      </div>
    </div>
    <div class="medium row">
      <fieldset class="controls">
        <button class="button">Swap</button>
      </fieldset>
    </div>
  </div>
  <script type="module" src="js/app.mjs"></script>
</body>
</html>
