<!--
  ============================================================
  vest1 #26 v2.0 | サムネイル お手本（全プロダクト共通・最初の1枚）
  ============================================================
  全プロダクトが最初に使うサムネイルの雛形。
  文章・色は「時と場合」によって変えるが、まず最初の1枚はこの構造から始めること。

  v2.0 改訂理由（2026-04-09）:
    DSL設計コース（4,000円）の実装過程でマスター承認。
    v1.0の左55右45二分割は廃止。中央集約型に転換。
    配色をパープル×バイオレット×イエロー（補色関係）に刷新。
    ココナラ縦長サイズ（1220x1240）に最適化。

  適用順序:
    1. このHTMLをプロダクトにコピー
    2. 4層のテキストを差し替え（ラベル / キャッチ / 価格 / サブコピー）
    3. 配色は3色維持。70:25:5（ベース/サブ/アクセント）の比率を崩さない
    4. ジャンプ率は維持: 価格211px > キャッチ119px > サブ43px（比率 4.89:2.76:1）
    5. PNG書き出し例: products/dify-service/tmp/thumb-to-png.js（puppeteer 2x DPI）

  黄金律ガイド（必読）:
    docs/standards/templates/thumbnail-master-guide.md（v2.0）

  関連vest1:
    #25 docs/standards/checklists/thumbnail-golden-rules.html
        （より広範な調査レポート。3秒ルール/Z型視線誘導/CTR等）

  出力サイズ: 1220x1240（ココナラ縦長推奨）

  配色（v2.0 確定値）:
    - ベース パープル: #3b1d60 / #4e297b / #603392 / #723fa2（グラデ4段）
    - サブ   バイオレット: #a78bfa（ラベル/AI強調/縦線/装飾グロー）
    - アクセント ゴールド: #fbbf24（価格のみ）
    - 文字白: #ffffff（コントラスト確保用、独立扱い）

  禁止事項:
    - ジャンプ率を縮めるな（階層が崩壊する）
    - 3色（+白）を超えるな（70:25:5の法則）
    - キャッチコピーを15文字超×1行で置くな（2行分割で16字まで許容）
    - 重要情報を下部に置くな（プラットフォームのタイトル/価格と重なる）
    - 明朝体を使うな（縮小で潰れる）
    - 「AI」等の強調文字をアクセント色（イエロー）にするな。サブ色（バイオレット）で統一し、アクセントは価格のみに集中させる
  ============================================================
-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=M+PLUS+Rounded+1c:wght@700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }

  /* ===== サムネイル：ココナラ推奨 1220x1240が多いが、汎用的に使える16:9寄り ===== */
  .thumbnail {
    width: 1220px;
    height: 1240px;
    position: relative;
    overflow: hidden;
    display: flex;
    background: #3b1d60;
    box-shadow: 0 20px 80px rgba(0,0,0,0.6);
    font-family: 'Noto Sans JP', sans-serif;
  }

  /* === 左ゾーン：文字 55% === */
  .left {
    width: 100%;
    height: 100%;
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 80px 56px;
    background: linear-gradient(160deg, #3b1d60 0%, #4e297b 60%, #603392 100%);
  }

  /* 背景のグロー演出 */
  .left::before {
    content: '';
    position: absolute;
    top: -100px;
    left: -100px;
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(167, 139, 250, 0.30) 0%, transparent 70%);
    z-index: 0;
  }

  /* 左から右へのグラデーション境界 */
  .left::after {
    content: '';
    position: absolute;
    bottom: -150px;
    right: -150px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(167, 139, 250, 0.25) 0%, transparent 70%);
    z-index: 0;
    pointer-events: none;
  }

  /* --- 第三階層：ラベル --- */
  .label {
    position: relative;
    z-index: 5;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
    align-self: center;
  }

  .label-badge {
    background: #a78bfa;
    color: #fff;
    font-size: 36px;
    font-weight: 900;
    padding: 5px 14px;
    border-radius: 4px;
    box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.25);
    letter-spacing: 0.08em;
  }

  .label-text {
    color: #ffffff;
    font-size: 36px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }

  /* --- 第一階層：キャッチコピー（ジャンプ率高） --- */
  .main-copy { text-align: center;
    position: relative;
    z-index: 5;
    margin-bottom: 40px;
    line-height: 1.2;
  }

  .main-copy .line {
    display: block;
    color: #fff;
    font-family: 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif;
    font-weight: 900;
  }

  .main-copy .line1 {
    font-size: 119px;
    letter-spacing: 0.02em;
    margin-bottom: 4px;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
  }

  .main-copy .line2 {
    font-size: 119px;
    letter-spacing: 0.02em;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
  }

  .main-copy .highlight {
    color: #a78bfa;
    font-size: 119px;
  }

  /* --- 価格（アクセント・目を止める要素） --- */
  .price-block {
    position: relative;
    z-index: 5;
    display: inline-flex;
    align-items: baseline;
    gap: 4px;
    margin-bottom: 24px;
    align-self: center;
  }

  .price-prefix {
    color: rgba(255,255,255,0.6);
    font-size: 48px;
    font-weight: 700;
  }

  .price-number {
    color: #fbbf24;
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-size: 211.2px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.02em;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.3);
  }

  .price-yen {
    color: #fbbf24;
    font-size: 86.39999999999999px;
    font-weight: 900;
    margin-left: 2px;
  }

  .price-tax {
    color: #ffffff;
    font-size: 38.4px;
    font-weight: 700;
    margin-left: 8px;
  }

  /* --- 第二階層：サブコピー --- */
  .sub-copy { text-align: left;
    position: relative;
    z-index: 5;
    color: #ffffff;
    font-size: 43.199999999999996px;
    font-weight: 700;
    letter-spacing: 0.06em;
    border-left: 6px solid #a78bfa;
    padding-left: 14px;
    line-height: 1.6;
  }

  /* === 右ゾーン：ビジュアル 45% === */
  .right {
    width: 45%;
    height: 100%;
    position: relative;
    background: linear-gradient(160deg, #603392 0%, #723fa2 50%, #4e297b 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* チャットUI風のモックアップ */
  .chat-mockup {
    position: relative;
    z-index: 5;
    width: 340px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 24px 20px;
    backdrop-filter: blur(10px);
    transform: rotate(-2deg) translateX(-10px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }

  .chat-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .chat-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #a78bfa, #a78bfa);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38.4px;
    color: #fff;
    font-weight: 900;
  }

  .chat-name {
    color: rgba(255,255,255,0.8);
    font-size: 33.6px;
    font-weight: 700;
  }

  .chat-status {
    color: #a78bfa;
    font-size: 26.4px;
    font-weight: 700;
  }

  .chat-bubble {
    border-radius: 16px;
    padding: 12px 16px;
    font-size: 31.2px;
    line-height: 1.6;
    margin-bottom: 10px;
    max-width: 85%;
  }

  .bubble-user {
    background: #a78bfa;
    color: #fff;
    margin-left: auto;
    border-bottom-right-radius: 4px;
    font-weight: 700;
  }

  .bubble-bot {
    background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.85);
    border-bottom-left-radius: 4px;
  }

  .chat-input {
    margin-top: 16px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 10px 16px;
    color: rgba(255,255,255,0.3);
    font-size: 28.799999999999997px;
  }

  /* 装飾：光のドット */
  .glow-dot {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(167, 139, 250, 0.4) 0%, transparent 70%);
  }

  .glow-dot.d1 { width: 200px; height: 200px; top: -40px; right: -40px; }
  .glow-dot.d2 { width: 150px; height: 150px; bottom: 60px; left: -30px; }
  .glow-dot.d3 { width: 100px; height: 100px; bottom: -20px; right: 80px; background: radial-gradient(circle, rgba(167, 139, 250, 0.25) 0%, transparent 70%); }

  /* 装飾：ネットワーク線 */
  .network-lines {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    opacity: 0.15;
  }

  .network-lines svg {
    width: 100%;
    height: 100%;
  }

  /* Difyロゴテキスト */
  .dify-badge {
    position: absolute;
    bottom: 30px;
    right: 30px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 6px 14px;
  }

  .dify-badge-text {
    color: rgba(255,255,255,0.5);
    font-size: 28.799999999999997px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }

  .dify-badge-logo {
    color: #a78bfa;
    font-size: 38.4px;
    font-weight: 900;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<div class="thumbnail">

  <!-- 左：文字ゾーン -->
  <div class="left">

    <!-- 第三階層：ラベル -->
    <div class="label">
      <span class="label-badge">DSL納品</span>
      <span class="label-text">すぐに使える</span>
    </div>

    <!-- 第一階層：キャッチコピー -->
    <div class="main-copy">
      <span class="line line1"><span class="highlight">AI</span>チャットボットを</span>
      <span class="line line2">あなたのサイトに</span>
    </div>

    <!-- 価格（アクセントカラー・ジャンプ率最大） -->
    <div class="price-block">
      <span class="price-number">4,000</span>
      <span class="price-yen">円</span>
      <span class="price-tax">（税込）</span>
    </div>

    <!-- 第二階層：サブコピー -->
    <div class="sub-copy">
      Dify構築済みDSLをお渡し<br>インポートするだけで即稼働
    </div>

  </div>

  </div>

</body>
</html>
