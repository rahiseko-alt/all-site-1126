<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポートフォリオ</title>
    <style>
        :root {
            --bg-color: #0F0F11;
            --card-bg: #18181C;
            --text-color: #E4E4E7;
            --text-muted: #A1A1AA;
            --accent-violet: #8B5CF6;
            --accent-blue: #3B82F6;
            --accent-gradient: linear-gradient(135deg, #8B5CF6 0%, #3B82F6 100%);
            --border-color: #27272A;
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-sans);
            min-height: 100vh;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient background glow */
        body::before {
            content: '';
            position: absolute;
            top: -10%;
            left: 20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.08) 0%, rgba(59, 130, 246, 0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -10%;
            right: 10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, rgba(139, 92, 246, 0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        header {
            width: 100%;
            max-width: 1200px;
            margin-bottom: 3.5rem;
            text-align: center;
        }

        .logo {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            display: inline-block;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 0.75rem;
            background: linear-gradient(180deg, #FFFFFF 0%, #A1A1AA 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1.05rem;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        main {
            width: 100%;
            max-width: 1200px;
            flex-grow: 1;
        }

        /* CSS Grid responsive layout */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 2rem;
            width: 100%;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), 
                        border-color 0.3s ease, 
                        box-shadow 0.3s ease;
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--accent-gradient);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: rgba(139, 92, 246, 0.4);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 
                        0 0 15px rgba(139, 92, 246, 0.1);
        }

        .card:hover::before {
            opacity: 1;
        }

        .iframe-container {
            width: 100%;
            aspect-ratio: 16 / 10;
            background-color: #000;
            position: relative;
            border-bottom: 1px solid var(--border-color);
            overflow: hidden;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .card-content {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.01em;
            color: #FFFFFF;
        }

        .card-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }

        .card-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            text-decoration: none;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
            cursor: pointer;
            width: 100%;
        }

        .card-btn:hover {
            background: var(--accent-gradient);
            border-color: transparent;
            color: #FFFFFF;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.25);
        }

        .card-btn svg {
            transition: transform 0.2s ease;
        }

        .card-btn:hover svg {
            transform: translate(2px, -2px);
        }

        footer {
            margin-top: 5rem;
            color: var(--text-muted);
            font-size: 0.8rem;
            letter-spacing: 0.05em;
            text-align: center;
            width: 100%;
            border-top: 1px solid var(--border-color);
            padding-top: 2rem;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <span class="logo">PORTFOLIO</span>
        <h1>ポートフォリオ</h1>
        <p class="subtitle">クリエイティブデモ・WebGL作品のコレクション。</p>
    </header>

    <main>
        <div class="grid-container">
            <!-- AUTO:registry-cards -->
            <!-- /AUTO -->
</div>
    </main>

    <footer>
        &copy; 2026 Kouhei Kosehira. All rights reserved.
    </footer>

    <!-- Modal Overlay for Premium Interactive View -->
    <div id="demo-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 15, 17, 0.9); z-index: 9999; backdrop-filter: blur(12px); align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease;">
        <div style="position: relative; width: 90%; height: 85%; max-width: 1200px; background: #18181C; border: 1px solid #27272A; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); transform: scale(0.95); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);">
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; border-bottom: 1px solid #27272A; background: #0F0F11;">
                <h3 id="modal-title" style="margin: 0; color: #FFFFFF; font-size: 1.1rem; font-weight: 700; letter-spacing: -0.01em;">Demo Viewer</h3>
                <button id="modal-close" style="background: rgba(255,255,255,0.05); border: 1px solid #27272A; color: #E4E4E7; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; transition: background 0.2s, color 0.2s;">&times;</button>
            </div>
            <iframe id="modal-iframe" src="" style="width: 100%; flex-grow: 1; border: none; background: #000;"></iframe>
        </div>
    </div>
    <script>
        (function() {
            const modal = document.getElementById('demo-modal');
            const modalContainer = modal.querySelector('div');
            const modalIframe = document.getElementById('modal-iframe');
            const modalTitle = document.getElementById('modal-title');
            const modalClose = document.getElementById('modal-close');

            function openModal(title, url) {
                modalTitle.textContent = title;
                modalIframe.src = url;
                modal.style.display = 'flex';
                // Trigger reflow for transition
                modal.offsetHeight;
                modal.style.opacity = '1';
                modalContainer.style.transform = 'scale(1)';
                document.body.style.overflow = 'hidden';
            }

            function closeModal() {
                modal.style.opacity = '0';
                modalContainer.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    modal.style.display = 'none';
                    modalIframe.src = '';
                }, 300);
                document.body.style.overflow = '';
            }

            modalClose.addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });

            // Convert and append modal trigger links inside each card
            document.querySelectorAll('.card').forEach(card => {
                const title = card.querySelector('.card-title').textContent;
                const iframe = card.querySelector('iframe');
                if (iframe) {
                    const url = iframe.getAttribute('src');
                    const cardContent = card.querySelector('.card-content');
                    
                    // Create overlay viewer button
                    const modalBtn = document.createElement('button');
                    modalBtn.className = 'card-btn';
                    modalBtn.style.marginTop = '8px';
                    modalBtn.style.background = 'rgba(139, 92, 246, 0.1)';
                    modalBtn.style.borderColor = 'rgba(139, 92, 246, 0.2)';
                    modalBtn.innerHTML = '<span>モーダルで開く</span><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"></path><path d="M9 21H3v-6"></path><path d="M21 3l-7 7"></path><path d="M3 21l7-7"></path></svg>';
                    
                    modalBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        openModal(title, url);
                    });
                    cardContent.appendChild(modalBtn);
                }
            });
        })();
    </script>

</body>
</html>
